version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.7
    hostname: zookeeper
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  broker:
    image: confluentinc/cp-kafka:7.7.7
    hostname: broker
    container_name: broker
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.7
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      - broker
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://broker:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    hostname: kafka-ui
    container_name: kafka-ui
    depends_on:
      - broker
      - schema-registry
    ports:
      - "58080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      DYNAMIC_CONFIG_ENABLED: true

  mongodb:
    image: mongodb/mongodb-community-server:7.0-ubi9
    hostname: mongodb
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongouser
      MONGO_INITDB_ROOT_PASSWORD: mongopass
  
  kafka-init-topics:
    image: confluentinc/cp-kafka:7.7.7
    depends_on:
      - broker
    command: "bash -c 'echo Waiting for Kafka to be ready... && \
      cub kafka-ready -b broker:29092 1 30 && \
      kafka-topics --create --topic epe.wforchestrator.fundscontroldebit     --bootstrap-server broker:29092 --partitions 2 --replication-factor 1 && \
      kafka-topics --create --topic epe.wfpaymentexecution.techerrorhandler  --bootstrap-server broker:29092 --partitions 2 --replication-factor 1 && \
      kafka-topics --create --topic epe.wfnotification.notifyevent           --bootstrap-server broker:29092 --partitions 2 --replication-factor 1 && \
      kafka-topics --create --topic epe.wfpaymentexecution.audithandler      --bootstrap-server broker:29092 --partitions 2 --replication-factor 1 && \
      kafka-topics --create --topic epe.wfpaymentexecution.audithandler.ex   --bootstrap-server broker:29092 --partitions 2 --replication-factor 1 && \
      kafka-topics --create --topic epe.wforchestrator.fundscontrolcredit    --bootstrap-server broker:29092 --partitions 2 --replication-factor 1'"