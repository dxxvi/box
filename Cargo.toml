[package]
name = "books_rust"
version = "0.1.0"
edition = "2024"

[dependencies]
age = "0.11.1"
colored = "3.0.0"
env_logger = "0.11.8"
log = "0.4.27"
regex = "1.11.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "macros", "time"] }
tokio = { version = "1.47.1", features = ["full"] }
time = { version = "0.3.41", features = ["serde-well-known", "macros", "local-offset"] }

[[test]]
name = "utils_tests"
path = "tests/utils_tests.rs"
